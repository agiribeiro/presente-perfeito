<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Responda 6 perguntas e receba 5 jogos de tabuleiro que combinam com quem vai ganhar o presente.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Presente Perfeito</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one centered column (max 720px) that behaves like a stack of cards — one question per card,
   a dice-pip stepper on top, then a results list where #1 is the hero. Board-game palette:
   cobalt "cubo azul" accent, meeple-yellow secondary, blue-biased neutrals. */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --fg:#13203A; --muted:#5B6B86; --line:#D9E0EA;
  --accent:#1E4FD8; --accent-ink:#FFFFFF; --accent-soft:#E6ECFB;
  --meeple:#F2B705; --meeple-ink:#3A2C00;
  --good:#1E8E5A;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
  --radius:14px; --shadow:0 1px 2px rgba(19,32,58,.06),0 8px 24px -12px rgba(19,32,58,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1626; --surface:#171F33; --fg:#EDF1F8; --muted:#A3AFC4; --line:#2A3550;
  --accent:#6B8DF5; --accent-ink:#0B1226; --accent-soft:#1D2A4A;
  --meeple:#F4C634; --meeple-ink:#2A1F00; --good:#4CC48A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#171F33; --fg:#EDF1F8; --muted:#A3AFC4; --line:#2A3550;
  --accent:#6B8DF5; --accent-ink:#0B1226; --accent-soft:#1D2A4A;
  --meeple:#F4C634; --meeple-ink:#2A1F00; --good:#4CC48A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--meeple);outline-offset:2px}

/* header */
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:.9rem;letter-spacing:0}

/* stepper: six dice pips */
.steps{display:flex;gap:8px;align-items:center}
.pip{width:12px;height:12px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.pip.done{background:var(--accent)}
.pip.now{background:var(--meeple);transform:scale(1.25)}
.steps span{margin-left:auto;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* question card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.card .eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card h2{font-size:clamp(1.5rem,4vw,2rem);font-weight:700;margin-top:6px}
.card .hint{color:var(--muted);margin-top:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:22px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--fg);min-height:64px;transition:border-color .15s,background .15s}
.opt b{font-weight:600}
.opt small{color:var(--muted);font-size:.85rem}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] b::after{content:" ✓";color:var(--accent)}
.age{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.age .opt{min-height:0;padding:10px 16px;flex-direction:row}
.age input{font:inherit;width:6.5em;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:12px 22px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);padding-left:0}
.btn.ghost:hover{color:var(--fg)}

/* results */
.results{display:flex;flex-direction:column;gap:14px}
.summary{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:.95rem}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;background:var(--surface);color:var(--fg)}
.chip.tag{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;box-shadow:var(--shadow)}
.res.top{border-color:var(--accent);border-width:2px}
.rank{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--accent);line-height:1;padding-top:2px;font-variant-numeric:tabular-nums}
.res.top .rank{background:var(--meeple);color:var(--meeple-ink);border-radius:10px;padding:6px 10px;font-size:1.3rem;align-self:start;justify-self:start}
.res h3{font-size:1.3rem;font-weight:700}
.res .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.res .why{margin-top:12px}
.res .match{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:.9rem}
.res .cta{margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.res .cta a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--meeple);color:var(--meeple-ink);font-weight:700;border-radius:999px;padding:11px 20px}
.res .cta a:hover{filter:brightness(1.05)}
.res .cta .faixa{color:var(--muted);font-size:.9rem}
.res .body{min-width:0}
.res .capa{float:right;width:96px;height:96px;object-fit:contain;margin:0 0 8px 12px;border-radius:8px;background:#fff}
@media (max-width:480px){.res .capa{width:72px;height:72px}}
.score{font-size:.8rem;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:10px;white-space:pre-wrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:.85rem;line-height:1.5;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.foot label{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){.card{padding:20px}.res{padding:18px;grid-template-columns:1fr}.rank{font-size:1.2rem}}
</style>
</head>
<body>


<div class="wrap">
  <header class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" fill="#fff" opacity=".15"/><circle cx="8" cy="8" r="2" fill="#F2B705"/><circle cx="16" cy="8" r="2" fill="#fff"/><circle cx="12" cy="12" r="2" fill="#fff"/><circle cx="8" cy="16" r="2" fill="#fff"/><circle cx="16" cy="16" r="2" fill="#F2B705"/></svg>
    </div>
    <h1>Presente Perfeito <small>Jogos de tabuleiro</small></h1>
  </header>

  <div class="steps" id="steps" aria-label="Progresso"></div>

  <section class="card" id="quiz"></section>

  <section class="results" id="results" hidden></section>

  <footer class="foot">
    <p id="disclosure">Como Associada da Amazon, a autora deste site recebe por compras qualificadas. Os preços e a disponibilidade mostrados são os da Amazon no momento da sua visita.</p>
    <label><input type="checkbox" id="curadoria"> Modo curadoria (mostrar a pontuação de cada resultado)</label>
    <p>Catálogo: <span id="ncat"></span> jogos · <span id="ncom"></span> com preço da Amazon · preços atualizados em <span id="atualizado"></span> · <a href="privacidade.html">Política de privacidade</a></p>
  </footer>
</div>

</script>
<script>
// ---------- configuração ----------
const AFFILIATE_TAG = "logicamentepresente-20";          // seu ID de rastreamento Amazon Associados
let CATALOGO = [];

const PERGUNTAS = [
  { key:"tipo", eyebrow:"Pergunta 1 de 6", titulo:"O que você procura?", single:true,
    opts:[ ["jogo","Jogo de tabuleiro","Cartas, tabuleiro, dados"], ["brinquedo","Brinquedo","Educativo, criativo, de rua"],
           ["lego","LEGO / construção","Blocos e kits de montar"], ["surpresa","Surpreenda-me","Qualquer categoria"] ] },
  { key:"idade", eyebrow:"Pergunta 2 de 6", titulo:"Quantos anos tem quem vai ganhar?", tipo:"idade",
    hint:"Vale a idade de quem vai jogar mais, não a mínima da caixa." },
  { key:"perfil", eyebrow:"Pergunta 3 de 6", titulo:"Como essa pessoa é?", hint:"Escolha até 2.", max:2,
    opts:[ ["criativo","Criativa","Inventa, desenha, conta histórias"], ["competitivo","Competitiva","Quer vencer"],
           ["curioso","Curiosa","Gosta de descobrir e deduzir"], ["construção","Construtora","Monta e encaixa"],
           ["ciência","Científica","Números, lógica, natureza"], ["arte","Artística","Cor, desenho, estética"],
           ["esportes","Agitada","Reflexo e velocidade"], ["estratégia","Estrategista","Planeja e decide"],
           ["personagens","Fã de personagens","Bichos, heróis, monstros"], ["brincar em grupo","De turma","Melhor com várias pessoas"] ] },
  { key:"preco", eyebrow:"Pergunta 4 de 6", titulo:"Quanto quer gastar?", single:true,
    opts:[ ["1","Até R$ 80",""], ["2","R$ 80 a 150",""], ["3","R$ 150 a 250",""], ["4","Acima de R$ 250",""] ] },
  { key:"ocasiao", eyebrow:"Pergunta 5 de 6", titulo:"Qual é a ocasião?", single:true,
    opts:[ ["aniversario","Aniversário",""], ["natal","Natal",""], ["criancas","Dia das Crianças",""], ["nenhuma","Sem ocasião","Só porque sim"] ] },
  { key:"prio", eyebrow:"Pergunta 6 de 6", titulo:"O que importa mais?", single:true,
    opts:[ ["div","Diversão","Risada e vontade de repetir"], ["edu","Educativo","Treina alguma habilidade"],
           ["cri","Criatividade","Imaginação e expressão"], ["imp","Impressionar","Uau ao abrir a caixa"], ["cb","Custo-benefício","Valor pelo que custa"] ] },
];
const NOME_TAG = {criativo:"criativa",competitivo:"competitiva",curioso:"curiosa",construção:"construtora",ciência:"científica",arte:"artística",esportes:"agitada",estratégia:"estrategista",personagens:"fã de personagens","brincar em grupo":"de turma",motor:"de movimento","faz de conta":"de faz de conta"};
const NOME_PRIO = {div:"diversão",edu:"educativo",cri:"criatividade",imp:"impressionar",cb:"custo-benefício"};
const FAIXAS = {1:[0,80],2:[80,150],3:[150,250],4:[250,99999]};

// ---------- motor de ranking ----------
function faixaDe(preco){ for (const [k,[a,b]] of Object.entries(FAIXAS)) if (preco>=a && preco<b) return +k; return 4; }
function pontuar(j, r){
  const razoes=[], det=[];
  let s=0;
  // tipo: filtro duro, exceto "surpreenda-me"
  if (r.tipo!=="surpresa" && j.tipo!==r.tipo) return null;
  // idade: filtro duro pela idade ideal mínima (curadoria), não pela da caixa
  // jogo leve pode descer um pouco na idade: complexidade <=1.5 → 2 anos abaixo; <=2.0 → 1 ano abaixo
  const idade=r.idade;
  const folga = j.peso<=1.5 ? 2 : (j.peso<=2.0 ? 1 : 0);
  if (idade < j.ideal_min - folga) return null;
  if (idade>=j.ideal_min && idade<=j.ideal_max){ s+=3; det.push("idade ideal +3"); razoes.push(`certo para ${idade>=18?"adultos":idade+" anos"}`); }
  else if (idade < j.ideal_min){ s+=1.5; det.push(`abaixo da ideal, mas leve (peso ${j.peso}) +1.5`); razoes.push("leve o bastante para essa idade"); }
  else if (idade<=j.ideal_max+1){ s+=1; det.push("idade próxima +1"); }
  else { det.push("fora da faixa ideal +0"); }
  if (idade < j.idade_min){ det.push(`caixa diz ${j.idade_min}+`); }
  // perfil: +2 por tag em comum
  const comuns=(r.perfil||[]).filter(t=>j.perfil.includes(t));
  if (comuns.length){ s+=2*comuns.length; det.push(`perfil ${comuns.join(", ")} +${2*comuns.length}`); comuns.forEach(t=>razoes.push(NOME_TAG[t])); }
  // preço: faixa de referência (até ter preço real da Amazon); desconhecido = neutro
  if (j.preco>0){
    const fj=faixaDe(j.preco), fr=+r.preco;
    if (fj===fr){ s+=3; det.push("preço na faixa +3"); }
    else if (Math.abs(fj-fr)===1){ s+=1; det.push("preço faixa vizinha +1"); }
    else { s-=2; det.push("preço longe −2"); }
  } else { s+=1; det.push("preço desconhecido +1 (neutro)"); }
  // prioridade: nota 0-3 × 2.5
  const p=j[r.prio]||0; s+=2.5*p; det.push(`${NOME_PRIO[r.prio]} ${p}×2.5 = +${2.5*p}`);
  if (p===3) razoes.push(`forte em ${NOME_PRIO[r.prio]}`);
  // ocasião: pequeno ajuste
  if (r.ocasiao==="natal"||r.ocasiao==="aniversario"){ s+=0.5*j.imp; det.push(`ocasião (impressionar) +${0.5*j.imp}`); }
  if (r.ocasiao==="criancas"){ s+=0.5*j.div; det.push(`ocasião (diversão) +${0.5*j.div}`); }
  if (r.ocasiao==="nenhuma"){ s+=0.5*j.cb; det.push(`ocasião (custo-benefício) +${0.5*j.cb}`); }
  // desempate determinístico: jogos mais leves primeiro para crianças menores
  s += (idade<8 ? (2-j.peso)*0.1 : 0);
  return {jogo:j, score:+s.toFixed(2), razoes, det};
}
function recomendar(r){
  return CATALOGO.map(j=>pontuar(j,r)).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,5);
}
function linkAmazon(j){
  const q=encodeURIComponent(j.nome+" jogo");
  if (j.url_afiliado) return j.url_afiliado;                      // vindo da Creators API (já com o tag)
  return j.asin ? `https://www.amazon.com.br/dp/${j.asin}?tag=${AFFILIATE_TAG}`
                : `https://www.amazon.com.br/s?k=${q}&tag=${AFFILIATE_TAG}`;
}
const BRL=v=>"R$ "+Number(v).toFixed(2).replace(".",",");

// ---------- UI ----------
const resp={tipo:null,idade:null,perfil:[],preco:null,ocasiao:null,prio:null};
let passo=0;
const $=s=>document.querySelector(s);
const quiz=$("#quiz"), steps=$("#steps"), results=$("#results");


function renderSteps(){
  steps.innerHTML = PERGUNTAS.map((_,i)=>`<div class="pip ${i<passo?"done":i===passo?"now":""}"></div>`).join("")
    + `<span>${Math.min(passo+1,6)} / 6</span>`;
}
function pronto(){
  const q=PERGUNTAS[passo], v=resp[q.key];
  if (q.tipo==="idade") return Number.isInteger(v) && v>=1 && v<=99;
  if (q.max) return v.length>=1;
  return !!v;
}
function renderQuiz(){
  const q=PERGUNTAS[passo];
  let corpo="";
  if (q.tipo==="idade"){
    const chips=[4,5,6,7,8,9,10,12,14,16];
    corpo=`<div class="age">
      ${chips.map(a=>`<button class="opt" data-idade="${a}" aria-pressed="${resp.idade===a}"><b>${a}</b></button>`).join("")}
      <button class="opt" data-idade="30" aria-pressed="${resp.idade===30}"><b>Adulto</b></button>
      <label><span class="eyebrow" style="font-size:.78rem;color:var(--muted)">ou digite</span>
        <input id="idade" type="number" min="1" max="99" inputmode="numeric" value="${resp.idade??""}" aria-label="Idade"></label>
    </div>`;
  } else {
    corpo=`<div class="opts">${q.opts.map(([v,l,d])=>{
      const on=q.max ? resp[q.key].includes(v) : resp[q.key]===v;
      return `<button class="opt" data-v="${v}" aria-pressed="${on}"><b>${l}</b>${d?`<small>${d}</small>`:""}</button>`;
    }).join("")}</div>`;
  }
  quiz.innerHTML=`<div class="eyebrow">${q.eyebrow}</div><h2>${q.titulo}</h2>${q.hint?`<p class="hint">${q.hint}</p>`:""}${corpo}
    <div class="nav">
      <button class="btn ghost" id="voltar" ${passo===0?"disabled":""}>← Voltar</button>
      <button class="btn" id="avancar" ${pronto()?"":"disabled"}>${passo===5?"Ver os 5 presentes":"Continuar →"}</button>
    </div>`;
  quiz.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if (b.dataset.idade){ resp.idade=+b.dataset.idade; }
    else if (q.max){
      const arr=resp[q.key], v=b.dataset.v, i=arr.indexOf(v);
      if (i>=0) arr.splice(i,1); else { if (arr.length>=q.max) arr.shift(); arr.push(v); }
    } else { resp[q.key]=b.dataset.v; }
    renderQuiz();
    if (!q.max && !b.dataset.idade) setTimeout(avancar,180);   // escolha única avança sozinha
  }));
  const inp=quiz.querySelector("#idade");
  if (inp){ inp.addEventListener("input",()=>{ resp.idade=inp.value===""?null:+inp.value; $("#avancar").disabled=!pronto(); quiz.querySelectorAll("[data-idade]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.idade===resp.idade)); }); }
  $("#voltar").addEventListener("click",()=>{ if (passo>0){ passo--; renderSteps(); renderQuiz(); } });
  $("#avancar").addEventListener("click",avancar);
}
function avancar(){
  if (!pronto()) return;
  if (passo<5){ passo++; renderSteps(); renderQuiz(); }
  else renderResultados();
}
function renderResultados(){
  const top=recomendar(resp), cur=$("#curadoria").checked;
  quiz.hidden=true; steps.hidden=true; results.hidden=false;
  const resumo=[resp.idade>=18?"adulto":`${resp.idade} anos`, ...resp.perfil.map(t=>NOME_TAG[t]), PERGUNTAS[3].opts.find(o=>o[0]===resp.preco)[1], NOME_PRIO[resp.prio]];
  let html=`<div class="card"><div class="eyebrow">Resultado</div><h2>${top.length?`Os ${top.length} presentes que mais combinam`:"Ainda não temos jogo para esse perfil"}</h2>
    <div class="summary" style="margin-top:10px">${resumo.map(t=>`<span class="chip">${t}</span>`).join("")}</div></div>`;
  if (!top.length) html+=`<div class="empty">Não achei nada para essa combinação. Tente outra faixa de preço ou “Surpreenda-me”.</div>`;
  top.forEach((r,i)=>{
    const j=r.jogo;
    html+=`<article class="res ${i===0?"top":""}">
      <div class="rank">${i===0?"Nº 1":i+1}</div>
      <div class="body">
        ${j.url_imagem?`<img class="capa" src="${j.url_imagem}" alt="" loading="lazy">`:""}
        <h3>${j.nome}</h3>
        <div class="meta">
          ${j.tipo==="jogo"?`<span class="chip">${j.jog_min===j.jog_max?j.jog_min:`${j.jog_min}–${j.jog_max}`} jogadores</span><span class="chip">${j.dur} min</span>`:`<span class="chip">${j.tipo==="lego"?"LEGO":"brinquedo"}</span>`}
          <span class="chip">${j.idade_min}+</span>
          ${j.editora&&j.editora!=="LEGO"?`<span class="chip">${j.editora}</span>`:""}
        </div>
        <p class="why">${j.por_que}</p>
        ${r.razoes.length?`<div class="match">Combina porque é ${r.razoes.map(t=>`<span class="chip tag">${t}</span>`).join("")}</div>`:""}
        <div class="cta">
          <a href="${linkAmazon(j)}" target="_blank" rel="noopener sponsored">Ver na Amazon →</a>
          <span class="faixa">${j.url_afiliado&&j.preco>0?`${BRL(j.preco)}${j.preco_lista>j.preco?` <s>${BRL(j.preco_lista)}</s>`:""} na Amazon`:(j.preco>0?`faixa de referência ≈ R$ ${j.preco}`:"preço atual na Amazon")}</span>
        </div>
        ${cur?`<div class="score">score ${r.score}\n${r.det.join("\n")}</div>`:""}
      </div></article>`;
  });
  html+=`<div class="nav"><button class="btn ghost" id="refazer">← Refazer o quiz</button><button class="btn" id="ajustar">Mudar só a prioridade</button></div>`;
  results.innerHTML=html;
  $("#refazer").addEventListener("click",()=>{ Object.assign(resp,{tipo:null,idade:null,perfil:[],preco:null,ocasiao:null,prio:null}); passo=0; results.hidden=true; quiz.hidden=false; steps.hidden=false; renderSteps(); renderQuiz(); window.scrollTo({top:0}); });
  $("#ajustar").addEventListener("click",()=>{ passo=5; results.hidden=true; quiz.hidden=false; steps.hidden=false; renderSteps(); renderQuiz(); window.scrollTo({top:0}); });
  window.scrollTo({top:0});
}
$("#curadoria").addEventListener("change",()=>{ if (!results.hidden) renderResultados(); });

function iniciar(){
  $("#ncat").textContent=CATALOGO.length;
  $("#ncom").textContent=CATALOGO.filter(j=>j.url_afiliado).length;
  const dt=CATALOGO.map(j=>j.atualizado_em).filter(Boolean).sort().pop();
  $("#atualizado").textContent=dt?dt.slice(0,10).split("-").reverse().join("/"):"—";
  renderSteps(); renderQuiz();
}
fetch("catalogo.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{ CATALOGO=d.filter(j=>j.ativo!==false || !window.SO_ATIVOS); iniciar(); })
  .catch(e=>{ quiz.innerHTML='<p class="hint">Não consegui carregar o catálogo (catalogo.json). Se abriu o arquivo direto do computador, rode <code>python3 -m http.server</code> na pasta e acesse localhost:8000.</p>'; });
</script>
