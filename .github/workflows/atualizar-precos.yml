name: Atualizar preços da Amazon

on:
  schedule:
    - cron: "17 9,21 * * *"   # todo dia 09:17 e 21:17 UTC = 06:17 e 18:17 em Natal
  workflow_dispatch:          # botão "Run workflow" para rodar na mão

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Buscar preço, imagem e link de cada ASIN
        env:
          AMAZON_CRED_ID: ${{ secrets.AMAZON_CRED_ID }}
          AMAZON_CRED_SECRET: ${{ secrets.AMAZON_CRED_SECRET }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: python scripts/amazon_sync.py catalogo_presentes.xlsx --atualizar

      - name: Gerar catalogo.json do site
        run: python scripts/exportar_json.py catalogo_presentes.xlsx --saida docs/catalogo.json

      - name: Publicar só o JSON (a planilha continua sendo editada por você)
        run: |
          git checkout -- catalogo_presentes.xlsx
          git config user.name "robo-precos"
          git config user.email "actions@users.noreply.github.com"
          git add docs/catalogo.json
          git diff --cached --quiet && echo "sem mudanças" || git commit -m "Preços da Amazon: $(date -u +%Y-%m-%d)" && git push
